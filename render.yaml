services:
  - type: web
    name: blender-mcp-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: standard        # 2GB RAM, 1 vCPU — required for headless Blender rendering
    envVars:
      - key: PORT
        value: 8000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BLENDER_GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Verified serving on the production key (see tools/llm_client.py).
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: blender-outputs
      - key: MCP_API_KEY
        sync: false
      # NVIDIA NIM is the only working provider (Qwen arrearage, DeepSeek 402,
      # Gemini free tier 5 req/min). Gemini remains available as a fallback.
      - key: LLM_PROVIDER
        value: nvidia
    healthCheckPath: /health
    autoDeploy: true
